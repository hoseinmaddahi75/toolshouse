version: '3.8'
services:
  db:
    image: postgres:15
    container_name: tooshouse-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: tooshouse-redis
    restart: always

  backend:
    build: ./my-medusa-backend
    container_name: tooshouse-backend
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      - ./my-medusa-backend/.env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@tooshouse-db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://tooshouse-redis:6379
      - STORE_CORS=${FRONTEND_URL}
      - ADMIN_CORS=${ADMIN_URL}
      - AUTH_CORS=${FRONTEND_URL},${ADMIN_URL}
      - MEDUSA_BACKEND_URL=${BACKEND_URL}
      - BACKEND_URL=${BACKEND_URL}
    ports:
      - "9000:9000"

  storefront:
    build:
      context: ./my-medusa-storefront
      args:
        - NEXT_PUBLIC_MEDUSA_BACKEND_URL=${BACKEND_URL}
    container_name: tooshouse-storefront
    restart: always
    depends_on:
      - backend
    env_file:
      - ./my-medusa-storefront/.env
    environment:
      - NEXT_PUBLIC_MEDUSA_BACKEND_URL=${BACKEND_URL}
      - NEXT_PUBLIC_BASE_URL=${FRONTEND_URL}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
