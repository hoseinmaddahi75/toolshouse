name: Deploy to Production

on:
  push:
    branches: [main, master]

# اگر دو تا کامیت پشت سر هم پوش کنی، اکشن قبلی رو کنسل می‌کنه تا سرور الکی شلوغ نشه
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # راه‌اندازی سیستم کَش و بیلد پیشرفته داکر
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./my-medusa-storefront
          file: ./my-medusa-storefront/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=pk_82b953b964ad71f051bb02d1382200901c260d0e8628f845fd00856125b14336
            NEXT_PUBLIC_MEDUSA_BACKEND_URL=https://api.toolshouse.ir
            NEXT_PUBLIC_BASE_URL=https://toolshouse.ir
            NEXT_PUBLIC_GLOBAL_SALE_PRICE_LIST_ID=plist_01KZKW5S7AASJA59B8A1NP8DMH

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./my-medusa-backend
          file: ./my-medusa-backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_GLOBAL_SALE_PRICE_LIST_ID=plist_01KZKW5S7AASJA59B8A1NP8DMH

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SERVER_SSH_KEY }}
          known_hosts: "just-a-placeholder-so-we-dont-get-errors"

      - name: Deploy to server
        run: |
          ssh -p ${SECRET_PORT} -o StrictHostKeyChecking=no ${SECRET_USER}@${SECRET_HOST} "
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin &&
            cd ~/toolshouse &&
            docker compose pull &&
            docker compose up -d --remove-orphans &&
            docker system prune -f
          "
        env:
          SECRET_HOST: ${{ secrets.SERVER_HOST }}
          SECRET_USER: ${{ secrets.SERVER_USER }}
          SECRET_PORT: ${{ secrets.SERVER_PORT }}